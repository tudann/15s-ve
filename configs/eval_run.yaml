# 固定案例的 10 条文生视频冒烟测试；调整 case_ids 可选择其他案例。
prompt_filename: prompt_final.txt
cases_root: ./data/固定case
input_modes: [t2va]
video_filenames: [seedance2.0-mini.mp4]
case_ids:
  - "001_T2V-1.1-A"
  - "002_T2V-1.1-B"
  - "003_T2V-1.2-A"
  - "004_T2V-1.2-B"
  - "005_T2V-1.3-A"
  - "006_T2V-1.3-B"
  - "007_T2V-1.4-A"
  - "008_T2V-1.4-B"
  - "009_T2V-1.5-A"
  - "010_T2V-1.5-B"
output_dir: ./outputs/eval
pipeline_config: ./configs/default.yaml
technical_gpu: ""  # 留空时从默认 GPU 中选择空闲显存最多的一张。
force: false
skip_judge: false
skip_technical: false
